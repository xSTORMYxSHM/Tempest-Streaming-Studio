<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tempest Streaming Twitch panel preview</title>
  <link rel="stylesheet" href="../../src/styles.css">
  <style>
    html, body { width: 318px; }
    .shell { width: 318px !important; }
    .grid { grid-template-columns: 1fr !important; }
  </style>
</head>
<body data-surface="panel" class="expanded">
  <main class="shell">
    <section class="deck">
      <header class="topbar">
        <span class="status-dot online"></span>
        <span class="brand"><span class="eyebrow">TEMPEST</span><strong>Live Signals</strong></span>
        <span class="status">SAFE PREVIEW</span>
      </header>
      <div class="content">
        <div class="intro">
          <div><span class="eyebrow">CHANNEL PANEL</span><h1>Activate a signal</h1></div>
          <span class="count">3 SIGNALS</span>
        </div>
        <p class="viewer-state">No Bits are used in preview</p>
        <div class="grid">
          <button class="product" type="button" style="--product-accent:#54F2EB">
            <span class="glyph">SP</span><span class="product-copy"><strong>Storm Pulse</strong><small>USE 50 BITS</small></span><span class="activate">ACTIVATE</span>
          </button>
          <button class="product" type="button" style="--product-accent:#A66BFF">
            <span class="glyph">GW</span><span class="product-copy"><strong>Gravity Well</strong><small>USE 100 BITS</small></span><span class="activate">ACTIVATE</span>
          </button>
          <button class="product" type="button" style="--product-accent:#FF9F43">
            <span class="glyph">OD</span><span class="product-copy"><strong>Overdrive</strong><small>USE 250 BITS</small></span><span class="activate">ACTIVATE</span>
          </button>
        </div>
      </div>
      <footer class="footer"><a href="#">Privacy</a><a href="#">Terms</a></footer>
    </section>
  </main>
</body>
</html>
